name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        # v1.0.3's Go SSH library offered only the legacy SHA-1 "ssh-rsa"
        # signature, which OpenSSH on the Ubuntu 26.04 host rejects — the
        # RSA deploy key authenticates fine from a normal ssh client, which
        # negotiates rsa-sha2-512 instead. v1.2.x supports rsa-sha2.
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /home/ubuntu/datacircles-crm
            git fetch origin main
            git reset --hard origin/main
            # Echoed so a run proves which commit it actually deployed —
            # four runs previously reported success against a stale host
            # without ever landing a commit on the live server.
            echo "Deployed commit: $(git rev-parse --short HEAD)"
            docker compose build crm-backend crm-frontend
            docker compose up -d crm-backend crm-frontend
            docker image prune -f
